name: get_guardian_cloud_profile
type: system
description: >-
  Read the guardian's full Rome Cloud profile: account email, Rome address,
  display name and sign-in links, their preview-survey answers (background,
  build goals, X and LinkedIn handles), and the Signup Research report on their
  public professional profile (identity verdict, headline, role, company,
  location, summary, cited facts, matched accounts, survey fit, limitations).
  For first-party callers that tailor output for the guardian alone, such as
  Briefing. Returns an error when the instance is not connected to Rome Cloud.
complexity: simple
speed: fast
reliability: high
sideEffects: read-only
# Personal context: kept out of wildcard agent allow-lists, which include
# chats with visitors and Rome's bot accounts. Apps reach it via runAction.
visibility: explicit
